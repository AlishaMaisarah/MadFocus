<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>💛Countdown Timer🍵</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cookie&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Press Start 2P', monospace;
      background: #ffffff;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    /* Main Container */
    .container {
      width: 90%;
      max-width: 600px;
      border: 4px solid #db9aea;
      border-radius: 30px;
      box-shadow: 0 5px 15px rgba(213,141,216,0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      background: #fff;
      border-bottom: 4px solid #db9aea;
      position: relative;
    }

    .top-bar h1 {
      color: #c979ec;
      margin: 0 auto; /* Center the title */
      font-size: 20px;
    }

    /* Timer Display - Centered */
    .timer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      min-height: 150px; /* Ensure enough space */
    }

    #timer {
      font-size: 70px;
      color: #7c7c7c;
      font-weight: bold;
      font-family: monospace;
      letter-spacing: 2px;
      margin: 0; /* Remove default margins */
    }

    /* Button Container */
    .button-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 0px 30px 23px;
    }

    /* Action Buttons */
    .action-button {
      font-family: 'Press Start 2P', monospace;
      background: #FFFFD6;
      color: #c979ec;
      border: 2px solid #db9aea;
      border-radius: 45px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(213, 141, 216, 0.4);
      transition: all 0.3s ease;
      min-width: 120px;
    }
    .action-button:hover {
      background: #db9aea;
      color: #fff;
      transform: scale(1.05);
    }

    /* Back Button */
    #backButton {
      font-family: 'Press Start 2P', monospace;
      background: #f0f0ff;
      color: #c979ec;
      border: 2px solid #db9aea;
      border-radius: 45px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(213, 141, 216, 0.4);
      transition: all 0.3s ease;
      margin: 10px auto 30px; /* Center the back button */
      display: block;
    }
    #backButton:hover {
      background: #db9aea;
      color: #fff;
    }

    /* Bubbles */
    .bubble {
      display: none;
      margin: 15px auto;
      padding: 12px 20px;
      background: #f0f0ff;
      border: 2px solid #db9aea;
      border-radius: 20px;
      width: fit-content;
      max-width: 80%;
      font-family: 'Cookie', cursive;
      font-size: 18px;
      color: #555;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 3px 10px rgba(213, 141, 216, 0.4);
    }

    /* Content Area */
    .content {
      padding: 30px 30px 30px;
      background: linear-gradient(to bottom, #fff, #fdf2ff);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    /* Floating Emojis */
    .floating-emoji {
      position: absolute;
      font-size: 20px;
      animation: float 3s ease-in-out infinite;
      opacity: 0.7;
      z-index: 0;
    }

    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <!-- MAIN CONTAINER -->
  <div class="container">
    <!-- TOP BAR -->
    <div class="top-bar">
      <h1>COUNTDOWN TIMER</h1>
    </div>

    <!-- CONTENT -->
    <div class="content">
      <!-- Centered Timer -->
      <div class="timer-container">
        <div id="timer">00:00:00</div>
      </div>

      <!-- Action Buttons -->
      <div class="button-container">
        <button class="action-button" onclick="pauseTimer('bubble1')">🛁TOILET🚽</button>
        <div id="bubble1" class="bubble">Don't just chase the "White Rabbit", chase your goals too.</div>

        <button class="action-button" onclick="pauseTimer('bubble2')">🍱EAT🍜</button>
        <div id="bubble2" class="bubble">Why, sometimes I've believed as many as 6 subjects before tea time.</div>

        <button class="action-button" onclick="openSpotify()">🎧MUSIC🎬</button>
        <div id="bubble3" class="bubble">In a world of nonsense, let your focus make sense.</div>
      </div>

      <button id="backButton" onclick="window.location.href='timer.html'">BACK</button>
      <div id="bubble4" class="bubble">Off with procrastination's head!!!</div>
    </div>

    <!-- Floating Emojis -->
    <div class="floating-emoji" style="top: 10%; left: 8%;">🐇</div>
    <div class="floating-emoji" style="top: 5%; right: 5%; animation-delay: 0.5s;">🫖</div>
    <div class="floating-emoji" style="top: 30%; left: 5%;">📖</div>
    <div class="floating-emoji" style="bottom: 55%; right: 5%; animation-delay: 1s;">❤️</div>
    <div class="floating-emoji spin" style="bottom: 30%; left: 12%; animation-delay: 0.3s;">💗</div>
    <div class="floating-emoji" style="top: 20%; left: 20%; animation-delay: 1.2s;">🦋</div>
    <div class="floating-emoji" style="top: 40%; right: 10%; animation-delay: 0.7s;">🌸</div>
    <div class="floating-emoji" style="bottom: 20%; right: 16%; animation-delay: 1.5s;">✨</div>
    <div class="floating-emoji" style="top: 15%; left: 1%;">🍄</div>
    <div class="floating-emoji fast-float" style="top: 25%; left: 2%;">🃏</div>
    <div class="floating-emoji" style="top: 50%; right: 15%; animation-delay: 0.5s;">🐈‍⬛</div>
    <div class="floating-emoji spin" style="top: 30%; right: 5%; animation-delay: 0.5s;">🗝️</div>
    <div class="floating-emoji" style="bottom: 25%; left: 2%; animation-delay: 1s;">🐱</div>
    <div class="floating-emoji" style="bottom: 15%; right: 7%;">🌷</div>
    <div class="floating-emoji fast-float" style="bottom: 4%; left: 20%; animation-delay: 0.5s;">🍵</div>
    <div class="floating-emoji" style="top: 15%; right: 10%; animation-delay: 1s;">🦋</div>
    <div class="floating-emoji spin" style="top: 50%; left: 5%; animation-delay: 1.5s;">🎲</div>
    <div class="floating-emoji fast-float" style="bottom: 6%; left: 5%; animation-delay: 0.5s;">⏰</div>
    <div class="floating-emoji fast-float" style="bottom: 6%; right: 5%; animation-delay: 0.5s;">🏰</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const minutes = parseInt(params.get('minutes'));
    let timeRemaining = minutes * 60;
    let timerInterval;
    let isPaused = false;

    function updateTimer() {
      let hours = Math.floor(timeRemaining / 3600);
      let mins = Math.floor((timeRemaining % 3600) / 60);
      let secs = timeRemaining % 60;

      document.getElementById("timer").textContent =
        String(hours).padStart(2, '0') + ":" +
        String(mins).padStart(2, '0') + ":" +
        String(secs).padStart(2, '0');

      if (!isPaused && timeRemaining > 0) {
        timeRemaining--;
      } 

      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        window.location.href = 'timeup.html';
      }
    }

    function pauseTimer(bubbleId) {
      isPaused = !isPaused;
      document.querySelectorAll('.bubble').forEach(b => b.style.display = 'none');
      if (isPaused) {
        document.getElementById(bubbleId).style.display = 'block';
      }
    }

    function openSpotify() {
      require('electron').shell.openExternal(
        'spotify:playlist:0kxIFyry0qYZi4xVUdfdcb'
      );

      document.querySelectorAll('.bubble').forEach(
        b => b.style.display = 'none' 
      );

      document.getElementById('bubble3').style.display = 'block';
    }

    // Initialize
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);

    // Hide bubbles when clicking outside
    document.addEventListener('click', function(event) {
      const isBubble = event.target.classList.contains('bubble');
      const isButton = event.target.classList.contains('action-button') || 
                       event.target.id === 'backButton';

      if (!isBubble && !isButton) {
        document.querySelectorAll('.bubble').forEach(b => b.style.display = 'none');
      }
    });

    // Back button hover effect
    const backButton = document.getElementById('backButton');
    const bubble4 = document.getElementById('bubble4');

    backButton.addEventListener('mouseover', () => {
      bubble4.style.display = 'block';
      bubble4.style.bottom = '70px';
      bubble4.style.left = '50%';
      bubble4.style.transform = 'translateX(-50%)';
    });

    backButton.addEventListener('mouseout', () => {
      bubble4.style.display = 'none';
    });
  </script>
</body>
</html>
