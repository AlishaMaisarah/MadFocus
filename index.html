<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>💗FOCUS📚</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cookie&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Press Start 2P', monospace;
      background: #ffffff;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    /* Main Container */
    .container {
      width: 90%;
      max-width: 600px;
      border: 4px solid #db9aea;
      border-radius: 30px;
      box-shadow: 0 5px 15px rgba(213,141,216,0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      background: #fff;
      border-bottom: 4px solid #db9aea;
      position: relative;
    }

    /* Top bar emoji decorations */
    .top-emoji-left,
    .top-emoji-right {
      position: absolute;
      font-size: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .top-emoji-left { left: 8px; }
    .top-emoji-right { right: 8px; }

    .top-bar h1,
    .top-bar p {
      color: #c979ec;
      margin: 0;
      font-size: 18px;
    }

    /* Content Area */
    .content {
      padding: 30px 30px 30px;
      background: linear-gradient(to bottom, #fff, #fdf2ff);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .content h1 {
      font-size: 50px;
      margin-bottom: 10px;
      color: #c979ec;
      position: relative;
    }

    .content h2 {
      font-size: 24px;
      margin: 0 0 30px;
      color: #c979ec;
      white-space: nowrap;
      position: relative;
    }

    /* Button decorations */
    .button-emoji-left,
    .button-emoji-right {
      position: absolute;
      font-size: 24px;
      top: 50%;
      transform: translateY(-50%);
      animation: bounce 2s infinite;
    }
    .button-emoji-left { left: -40px; }
    .button-emoji-right { right: -40px; }

    button {
      font-family: 'Press Start 2P', monospace;
      background: #FFFFD6;
      color: #c979ec;
      border: 2px solid #db9aea;
      border-radius: 45px;
      padding: 15px 35px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(213, 141, 216, 0.6);
      transition: all 0.3s ease;
      margin-bottom: 20px;
      position: relative;
    }
    button:hover {
      background: #db9aea;
      color: #fff;
      transform: scale(1.05);
    }

    /* Quote & DREAMER Section */
    .footer {
      background: #fff;
      padding: 0 30px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .quote {
      font-family: 'Cookie', cursive;
      font-size: 18px;
      color: #555;
      font-style: italic;
      margin-bottom: 10px;
      max-width: 80%;
      line-height: 1.4;
      position: relative;
      padding: 0 30px;
    }

    .quote-line {
      display: block;
    }

    .dreamer {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: #c979ec;
      letter-spacing: 1px;
      margin-top: 5px;
      position: relative;
      padding: 0 30px;
    }

    /* Emoji Decorations */
    .quote-emoji-left,
    .quote-emoji-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
    }
    .quote-emoji-left { left: 0; }
    .quote-emoji-right { right: 0; }

    .dreamer-emoji-left,
    .dreamer-emoji-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
    }
    .dreamer-emoji-left { left: 0; }
    .dreamer-emoji-right { right: 0; }

    /* Floating Emojis */
    .floating-emoji {
      position: absolute;
      font-size: 20px;
      animation: float 3s ease-in-out infinite;
      opacity: 0.7;
      z-index: 0;
    }

    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(-50%) scale(1); }
      50% { transform: translateY(-50%) scale(1.2); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* Special emoji animations */
    .spin { animation: spin 5s linear infinite; }
    .pulse { animation: pulse 2s ease infinite; }
    .fast-float { animation: float 2s ease-in-out infinite; }
  </style>
</head>
<body>
  <!-- MAIN CONTAINER -->
  <div class="container">
    <!-- TOP BAR with emoji decorations -->
    <div class="top-bar">
      <span class="top-emoji-left">👑</span>
      <h1>LEVEL UP</h1>
      <p>STUDY TIMER</p>
      <span class="top-emoji-right">⏳</span>
    </div>

    <!-- CONTENT -->
    <div class="content">
      <!-- Title with emoji decorations -->
      <h1>
        <span class="floating-emoji" style="left:-30px; top:20px;">🎯</span>
        MadFocus
        <span class="floating-emoji" style="right:-30px; top:20px;">🎯</span>
      </h1>
      
      <!-- Subtitle with emoji decorations -->
      <h2>
        <span class="floating-emoji spin" style="left:-25px;">🎩</span>
        Locked-In Timer
        <span class="floating-emoji spin" style="right:-25px;">🫖</span>
      </h2>
      
      <!-- Button with animated emoji decorations -->
      <div style="position:relative;">
        <span class="button-emoji-left pulse">🐇</span>
        <button id="startBtn">Start</button>
        <span class="button-emoji-right pulse">⏱️</span>
      </div>
    </div>

    <!-- QUOTE & DREAMER with emoji decorations -->
    <div class="footer">
      <p class="quote">
        <span class="quote-line">"Even Mad Hatter needed time to plan the tea party</span>
        <span class="quote-line">— so plan your study time too."</span>
      </p>
      <p class="dreamer">
        <span class="dreamer-emoji-left">✨</span>
        DREAMER
        <span class="dreamer-emoji-right">✨</span>
      </p>
    </div>

    <!-- Floating Background Emojis -->
    <div class="floating-emoji" style="top: 15%; left: 5%;">🍄</div>
    <div class="floating-emoji fast-float" style="top: 25%; left: 2%;">🃏</div>
    <div class="floating-emoji" style="top: 47%; right: 8%; animation-delay: 0.5s;">🐈‍⬛</div>
    <div class="floating-emoji spin" style="top: 30%; right: 5%; animation-delay: 0.5s;">🗝️</div>
    <div class="floating-emoji" style="bottom: 25%; left: 8%; animation-delay: 1s;">❤️</div>
    <div class="floating-emoji pulse" style="bottom: 30%; right: 5%; animation-delay: 1.5s;">👗</div>
    <div class="floating-emoji" style="bottom: 15%; right: 7%;">🌷</div>
    <div class="floating-emoji fast-float" style="bottom: 15%; left: 10%; animation-delay: 0.5s;">🍰</div>
    <div class="floating-emoji" style="top: 15%; right: 10%; animation-delay: 1s;">🦋</div>
    <div class="floating-emoji spin" style="top: 50%; left: 5%; animation-delay: 1.5s;">🎲</div>
    <div class="floating-emoji fast-float" style="bottom: 6%; left: 5%; animation-delay: 0.5s;">🐱</div>
    <div class="floating-emoji fast-float" style="bottom: 6%; right: 5%; animation-delay: 0.5s;">🏰</div>
  </div>

  <script>
    document.getElementById('startBtn').addEventListener('click', function() {
      alert('Im late, Im late! Down the rabbit hole of knowledge I go🐇');
      // Later: replace alert with real timer logic
      window.location.href = 'timer.html';
    });
  </script>
</body>
</html>
