<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎉 Completion Celebration</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cookie&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Press Start 2P', monospace;
      background: #ffffff;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 600px;
      border: 4px solid #db9aea;
      border-radius: 30px;
      box-shadow: 0 5px 15px rgba(213,141,216,0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 30px;
      background: #fff;
      border-bottom: 4px solid #db9aea;
      position: relative;
    }

    .top-emoji-left,
    .top-emoji-right {
      position: absolute;
      font-size: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .top-emoji-left { left: 8px; }
    .top-emoji-right { right: 8px; }

    .top-bar h1 {
      color: #c979ec;
      margin: 0 auto;
      font-size: 18px;
      position: relative;
    }

    .content-area {
      padding: 0px 30px 0px;
      background: linear-gradient(to bottom, #fff, #fdf2ff);
      flex-grow: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      justify-content: space-between; /* Critical change */
  position: relative;
  min-height: unset; /* Remove any fixed heights */
    }

    video {
      width: 80%;
      max-height: 300px;
      object-fit: contain;
      margin: 0px;
    }

    .message {
      position: absolute;
      color: #db9aea;
      font-family: 'Cookie', cursive;
      font-size: 2rem;
      text-align: center;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 2;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      width: 100%;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .centered {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .below {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .message.show {
      opacity: 1;
    }

    .footer {
      background: #fff;
      padding: 0 30px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .quote {
      font-family: 'Cookie', cursive;
      font-size: 18px;
      color: #555;
      font-style: italic;
      margin-bottom: 10px;
      max-width: 80%;
      line-height: 1.4;
      position: relative;
      padding: 0 30px;
    }

    .quote-line {
      display: block;
    }

    .dreamer {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: #c979ec;
      letter-spacing: 1px;
      margin-top: 5px;
      position: relative;
      padding: 0 30px;
    }

    /* Emoji Decorations */
    .quote-emoji-left,
    .quote-emoji-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
    }
    .quote-emoji-left { left: 0; }
    .quote-emoji-right { right: 0; }

    .dreamer-emoji-left,
    .dreamer-emoji-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
    }
    .dreamer-emoji-left { left: 0; }
    .dreamer-emoji-right { right: 0; }

    /* Floating Emojis */
    .floating-emoji {
      position: absolute;
      font-size: 20px;
      animation: float 3s ease-in-out infinite;
      opacity: 0.7;
      z-index: 0;
    }

    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    .fast-float { animation: float 2s ease-in-out infinite; }
    .spin { animation: spin 5s linear infinite; }
    .pulse { animation: pulse 2s ease infinite; }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Bar -->
  <div class="top-bar">
    <span class="top-emoji-left">🎉</span>
    <h1>LEVEL COMPLETED</h1>
    <span class="top-emoji-right">🏆</span>
  </div>

  <!-- Content Area -->
  <div class="content-area">
    <video id="introVideo" autoplay muted playsinline>
      <source src="videos/madfocus.mp4" type="video/mp4">
    </video>
    
    <!-- Messages -->
    <div id="msg1" class="message centered">MadFocus journey completed</div>
    <div id="msg2" class="message below">Now you're a little wiser than yesterday</div>
    <div id="msg3" class="message centered">Loading next adventure...</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p class="quote">
      <span class="quote-line">"Even Mad Hatter needed time to plan the tea party</span>
      <span class="quote-line">— so plan your study time too."</span>
    </p>
    <p class="dreamer">
      <span class="dreamer-emoji-left">✨</span>
      DREAMER
      <span class="dreamer-emoji-right">✨</span>
    </p>
  </div>

  <!-- Floating Background Emojis -->
  <div class="floating-emoji" style="top: 15%; left: 5%;">⏰</div>
    <div class="floating-emoji fast-float" style="top: 30%; left: 2%;">🃏</div>
    <div class="floating-emoji" style="top: 47%; right: 8%; animation-delay: 0.5s;">📖</div>
    <div class="floating-emoji spin" style="top: 30%; right: 5%; animation-delay: 0.5s;">🗝️</div>
    <div class="floating-emoji" style="bottom: 25%; left: 8%; animation-delay: 1s;">👗</div>
    <div class="floating-emoji pulse" style="bottom: 30%; right: 5%; animation-delay: 1.5s;">🐀</div>
    <div class="floating-emoji" style="bottom: 15%; right: 7%;">🌷</div>
    <div class="floating-emoji fast-float" style="bottom: 15%; left: 10%; animation-delay: 0.5s;">🐰</div>
    <div class="floating-emoji" style="top: 15%; right: 10%; animation-delay: 1s;">🌸</div>
    <div class="floating-emoji spin" style="top: 50%; left: 5%; animation-delay: 1.5s;">🎲</div>
    <div class="floating-emoji fast-float" style="bottom: 6%; left: 5%; animation-delay: 0.5s;">🎩</div>
    <div class="floating-emoji fast-float" style="bottom: 6%; right: 5%; animation-delay: 0.5s;">🚪</div>
</div>

<script>
  const video = document.getElementById('introVideo');
  const msg1 = document.getElementById('msg1');
  const msg2 = document.getElementById('msg2');
  const msg3 = document.getElementById('msg3');

  video.play().catch(() => { fallbackSequence(); });

  video.addEventListener('ended', () => { runSequence(); });

  function runSequence() {
    setTimeout(() => { msg1.classList.add('show'); }, 1000);
    setTimeout(() => { msg1.classList.remove('show'); msg2.classList.add('show'); }, 4000);
    setTimeout(() => { msg2.classList.remove('show'); msg3.classList.add('show'); }, 8000);
    setTimeout(() => { window.location.href = 'index.html'; }, 12000);
  }

  function fallbackSequence() { runSequence(); }
</script>

</body>
</html>
